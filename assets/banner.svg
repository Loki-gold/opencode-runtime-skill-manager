<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="OpenCode Runtime Skill Manager">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b10"/>
      <stop offset="0.55" stop-color="#0b1219"/>
      <stop offset="1" stop-color="#071014"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ef2c0"/>
      <stop offset="0.5" stop-color="#54d2ff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1721"/>
      <stop offset="1" stop-color="#0a1118"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>
  <circle cx="1110" cy="70" r="190" fill="#54d2ff" opacity="0.07" filter="url(#glow)"/>
  <circle cx="120" cy="360" r="170" fill="#5ef2c0" opacity="0.06" filter="url(#glow)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="64" y="92" fill="#5ef2c0" font-size="15" letter-spacing="4">OPENCODE PLUGIN</text>
    <text x="62" y="158" fill="#f4f8fb" font-size="52" font-weight="700" letter-spacing="-1">Runtime Skill Manager</text>
    <text x="64" y="198" fill="#9fb2c3" font-size="20">Teach your agent a new skill mid-session. No restart.</text>

    <g transform="translate(64 238)">
      <rect x="0" y="0" width="600" height="128" rx="12" fill="url(#panel)" stroke="#1f303f"/>
      <rect x="0" y="0" width="600" height="28" rx="12" fill="#111c26"/>
      <circle cx="20" cy="14" r="4" fill="#ff5f56"/>
      <circle cx="36" cy="14" r="4" fill="#ffbd2e"/>
      <circle cx="52" cy="14" r="4" fill="#27c93f"/>
      <text x="74" y="18" fill="#6f8496" font-size="11">opencode — skill-manager</text>
      <text x="20" y="56" fill="#6f8496" font-size="13">›</text>
      <text x="40" y="56" fill="#dce9f2" font-size="13">skill_search</text>
      <text x="140" y="56" fill="#5ef2c0" font-size="13">"blender animation"</text>
      <text x="20" y="80" fill="#6f8496" font-size="13">›</text>
      <text x="40" y="80" fill="#dce9f2" font-size="13">skill_inspect</text>
      <text x="160" y="80" fill="#8aa0b2" font-size="13">12 files · 0 findings</text>
      <text x="20" y="104" fill="#6f8496" font-size="13">›</text>
      <text x="40" y="104" fill="#dce9f2" font-size="13">skill_install</text>
      <text x="160" y="104" fill="#54d2ff" font-size="13">registered live</text>
    </g>

    <g transform="translate(700 238)">
      <rect x="0" y="0" width="516" height="128" rx="12" fill="url(#panel)" stroke="#1f303f"/>
      <text x="24" y="34" fill="#5ef2c0" font-size="11" letter-spacing="2">AVAILABLE IN</text>
      <text x="24" y="74" fill="#f4f8fb" font-size="30" font-weight="700">next model step</text>
      <text x="24" y="104" fill="#7f94a6" font-size="12">staged · validated · verified · reversible</text>
    </g>

    <text x="64" y="402" fill="#5c7284" font-size="12">skills.sh · GitHub · direct SKILL.md · OpenCode catalogs</text>
    <text x="1216" y="402" fill="#5c7284" font-size="12" text-anchor="end">MIT</text>
  </g>
</svg>
